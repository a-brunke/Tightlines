<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1620">
  <title>TightLines — Ontario Fishing Companion</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 48 48" class="brand-icon" aria-hidden="true">
        <path class="bi-fish" d="M6 24c6-8 14-12 22-12 6 0 11 4 14 8-3 4-8 8-14 8-8 0-16-4-22-4z" transform="translate(0,4)"/>
        <circle class="bi-eye" cx="34" cy="24" r="2"/>
        <path class="bi-tail" d="M42 18l6-4-2 10 2 10-6-4z" transform="translate(-4,-4) scale(0.95)"/>
      </svg>
      <div>
        <div class="brand-name">TightLines</div>
        <div class="brand-sub" id="brand-sub">Lake Kagawong · Ontario</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-install" class="icon-btn hidden" title="Install app" aria-label="Install app">⤓</button>
      <button id="btn-theme" class="icon-btn" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <main id="screen" class="screen"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/today" data-tab="today"><span class="tab-ico">☀️</span><span>Today</span></a>
    <a href="#/fish" data-tab="fish"><span class="tab-ico">🐟</span><span>Fish</span></a>
    <a href="#/map" data-tab="map"><span class="tab-ico">🗺️</span><span>Map</span></a>
    <a href="#/log" data-tab="log"><span class="tab-ico">🏆</span><span>Log</span></a>
    <a href="#/learn" data-tab="learn"><span class="tab-ico">🎓</span><span>Learn</span></a>
  </nav>

  <div id="toast-host"></div>
  <div id="sheet-host"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
